# ── Kiosco · configuracion de publicacion ──────────────────
# Sitio estatico independiente, sin nada que "construir".
# Netlify solo copia los archivos tal como estan.
# La carpeta base del sitio en Netlify es "kiosco", por eso
# publish apunta a la propia carpeta.

[build]
  publish = "."
  command = ""

# ── Seguridad basica ───────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ── Hojas de estilo ────────────────────────────────────────
# El navegador puede guardarlas, pero SIEMPRE pregunta si
# cambiaron antes de usarlas. Si no cambiaron, el servidor
# responde 304 en unos 200 bytes: practicamente gratis.
#
# NUNCA poner "immutable" aqui. Esa palabra le dice al
# navegador que no vuelva a preguntar, y deja al usuario
# viendo estilos viejos hasta que borre la cache a mano.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Imagenes propias del sitio ─────────────────────────────
# Estas casi nunca cambian y pesan, asi que se guardan una
# semana. Sin "immutable": si alguna se reemplaza, el usuario
# la ve actualizada en siete dias como maximo, sin borrar nada.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ── App de pedidos: service worker y manifest ──────────────
# Siempre se piden frescos, para que una actualizacion de la
# app llegue al telefono la proxima vez que se abra.
[[headers]]
  for = "/sw-pedidos.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/pedidos.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"
