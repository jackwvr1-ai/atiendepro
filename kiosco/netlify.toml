# ── Kiosco · configuracion de publicacion ──────────────────
# Sitio estatico independiente, sin nada que "construir".
# Netlify solo copia los archivos tal como estan.
# La carpeta base del sitio en Netlify es "kiosco", por eso
# publish apunta a la propia carpeta.

[build]
  publish = "."
  command = ""

# ── Seguridad basica ───────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ── Cache largo para recursos que cambian poco ─────────────
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
