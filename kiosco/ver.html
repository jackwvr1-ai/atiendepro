<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kiosco</title>
<link rel="stylesheet" href="css/publico.css">
</head>
<body>

<div id="estadoCargando" class="estado-pantalla">
  <p>Cargando...</p>
</div>

<div id="estadoNoDisponible" class="estado-pantalla" hidden>
  <div class="icono">🚫</div>
  <h1>Este kiosco no está disponible</h1>
  <p>Revisa el enlace o pídele al negocio que te comparta uno nuevo.</p>
</div>

<div id="contenido" class="envoltorio" hidden>

  <div class="cabecera">
    <div class="portada-negocio" id="portadaNegocio" hidden>
      <img id="imgPortadaNegocio" alt="" loading="lazy">
    </div>
    <div class="info-cabecera">
      <div class="logo-negocio" id="logoNegocio" hidden>
        <img id="imgLogoNegocio" alt="" loading="lazy">
      </div>
      <div class="texto-cabecera">
        <h1 class="nombre-negocio" id="nombreNegocio"></h1>
        <p class="descripcion-negocio" id="descripcionNegocio" hidden></p>
      </div>
    </div>
  </div>

  <div class="menu" id="menu"></div>

</div>

<button type="button" id="barraCarrito" class="barra-carrito">
  <span class="cantidad-carrito" id="cantidadCarrito"></span>
  <span class="total-carrito" id="totalCarrito"></span>
</button>

<div id="carritoOverlay" class="carrito-overlay"></div>

<div id="carritoPanel" class="carrito-panel">

  <div id="vistaCarrito" class="vista-panel">
    <div class="carrito-encabezado">
      <h2>Tu pedido</h2>
      <button type="button" id="cerrarCarrito" class="cerrar-carrito" aria-label="Cerrar">✕</button>
    </div>

    <div class="carrito-lista" id="carritoLista"></div>

    <div class="carrito-pie">
      <div class="fila-total">
        <span>Total</span>
        <span id="totalPie">$0.00</span>
      </div>
      <button type="button" id="btnHacerPedido" class="boton-hacer-pedido">Hacer pedido</button>
    </div>
  </div>

  <div id="vistaCheckout" class="vista-panel" hidden>
    <div class="carrito-encabezado con-volver">
      <button type="button" id="volverCarrito" class="cerrar-carrito" aria-label="Volver">←</button>
      <h2>Tus datos</h2>
      <button type="button" id="cerrarCheckout" class="cerrar-carrito" aria-label="Cerrar">✕</button>
    </div>

    <form id="formCheckout" class="checkout-cuerpo" novalidate>
      <div class="campo-checkout">
        <label for="checkoutNombre">Nombre</label>
        <input type="text" id="checkoutNombre" name="checkoutNombre" placeholder="Tu nombre" maxlength="80" autocomplete="name" required>
      </div>

      <div class="campo-checkout">
        <label for="checkoutTelefono">Teléfono</label>
        <input type="tel" id="checkoutTelefono" name="checkoutTelefono" placeholder="Tu teléfono" maxlength="30" autocomplete="tel" required>
      </div>

      <div class="campo-checkout" id="grupoModalidad" hidden>
        <label>¿Cómo lo quieres?</label>
        <div class="opciones-modalidad">
          <button type="button" id="modalidadRecoger" class="boton-modalidad">Recoger</button>
          <button type="button" id="modalidadEntrega" class="boton-modalidad">A domicilio</button>
        </div>
      </div>

      <div class="campo-checkout" id="grupoDireccion" hidden>
        <label for="checkoutDireccion">Dirección de entrega</label>
        <textarea id="checkoutDireccion" name="checkoutDireccion" placeholder="Calle, número, referencias..." maxlength="300" rows="2"></textarea>
      </div>

      <div class="campo-checkout">
        <label for="checkoutNota">Nota (opcional)</label>
        <textarea id="checkoutNota" name="checkoutNota" placeholder="Ej. sin cebolla, tocar el timbre..." maxlength="300" rows="2"></textarea>
      </div>

      <div id="mensajeCheckout" class="mensaje-checkout" hidden></div>
    </form>

    <div class="carrito-pie">
      <button type="submit" form="formCheckout" id="btnEnviarPedido" class="boton-hacer-pedido">Enviar pedido</button>
    </div>
  </div>

  <div id="vistaConfirmacion" class="vista-panel" hidden>
    <div class="confirmacion">
      <div class="icono-confirmacion">✓</div>
      <h2 class="titulo-confirmacion" id="tituloConfirmacion">Pedido enviado</h2>
      <p class="numero-confirmacion" id="numeroConfirmacion">Pedido #0</p>
      <p class="total-confirmacion" id="totalConfirmacion">$0.00</p>
    </div>
    <div class="carrito-pie">
      <button type="button" id="btnCerrarConfirmacion" class="boton-hacer-pedido">Listo</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://wetpjfpefypgzmcfoxui.supabase.co";
  var SUPABASE_ANON = "sb_publishable_e9LsWcWIJ3O_nmt2oGAJ5Q_JntD51xn";

  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: { persistSession: false }
  });

  var COLUMNAS_KIOSCO = "id,nombre,slug,descripcion,logo_url,portada_url,tema,color_acento,moneda,telefono_contacto,whatsapp,direccion,pide_direccion,publicado";

  var kioscoActual = null;
  var productosPorId = {};
  var carrito = {}; // { productoId: cantidad }

  var estadoCargando = document.getElementById("estadoCargando");
  var estadoNoDisponible = document.getElementById("estadoNoDisponible");
  var contenido = document.getElementById("contenido");

  var portadaNegocio = document.getElementById("portadaNegocio");
  var imgPortadaNegocio = document.getElementById("imgPortadaNegocio");
  var logoNegocio = document.getElementById("logoNegocio");
  var imgLogoNegocio = document.getElementById("imgLogoNegocio");
  var nombreNegocio = document.getElementById("nombreNegocio");
  var descripcionNegocio = document.getElementById("descripcionNegocio");
  var menu = document.getElementById("menu");

  var barraCarrito = document.getElementById("barraCarrito");
  var cantidadCarrito = document.getElementById("cantidadCarrito");
  var totalCarrito = document.getElementById("totalCarrito");

  var carritoOverlay = document.getElementById("carritoOverlay");
  var carritoPanel = document.getElementById("carritoPanel");
  var cerrarCarrito = document.getElementById("cerrarCarrito");
  var carritoLista = document.getElementById("carritoLista");
  var totalPie = document.getElementById("totalPie");
  var btnHacerPedido = document.getElementById("btnHacerPedido");

  var vistaCarrito = document.getElementById("vistaCarrito");
  var vistaCheckout = document.getElementById("vistaCheckout");
  var vistaConfirmacion = document.getElementById("vistaConfirmacion");

  var volverCarrito = document.getElementById("volverCarrito");
  var cerrarCheckout = document.getElementById("cerrarCheckout");
  var formCheckout = document.getElementById("formCheckout");
  var checkoutNombre = document.getElementById("checkoutNombre");
  var checkoutTelefono = document.getElementById("checkoutTelefono");
  var grupoModalidad = document.getElementById("grupoModalidad");
  var modalidadRecoger = document.getElementById("modalidadRecoger");
  var modalidadEntrega = document.getElementById("modalidadEntrega");
  var grupoDireccion = document.getElementById("grupoDireccion");
  var checkoutDireccion = document.getElementById("checkoutDireccion");
  var checkoutNota = document.getElementById("checkoutNota");
  var mensajeCheckout = document.getElementById("mensajeCheckout");
  var btnEnviarPedido = document.getElementById("btnEnviarPedido");

  var tituloConfirmacion = document.getElementById("tituloConfirmacion");
  var numeroConfirmacion = document.getElementById("numeroConfirmacion");
  var totalConfirmacion = document.getElementById("totalConfirmacion");
  var btnCerrarConfirmacion = document.getElementById("btnCerrarConfirmacion");

  var URL_CREAR_PEDIDO = SUPABASE_URL + "/functions/v1/crear-pedido-kiosco";
  var modalidadSeleccionada = "recoger";
  var enviandoPedido = false;

  function mostrarSolo(elemento) {
    estadoCargando.hidden = elemento !== estadoCargando;
    estadoNoDisponible.hidden = elemento !== estadoNoDisponible;
    contenido.hidden = elemento !== contenido;
  }

  function formatearPrecio(valor) {
    return "$" + Number(valor).toFixed(2);
  }

  function obtenerSlug() {
    var partes = window.location.pathname.split("/").filter(Boolean);
    var ultimo = (partes[partes.length - 1] || "").toLowerCase();

    if (!ultimo || ultimo === "ver.html") {
      var params = new URLSearchParams(window.location.search);
      return (params.get("slug") || params.get("k") || "").trim().toLowerCase();
    }

    try {
      return decodeURIComponent(ultimo).trim().toLowerCase();
    } catch (e) {
      return ultimo;
    }
  }

  // ---- Menú ----

  function agruparProductosPorCategoria(categorias, productos) {
    var grupos = [];

    categorias.forEach(function (categoria) {
      var deLaCategoria = productos.filter(function (p) {
        return p.categoria_id === categoria.id;
      });
      if (deLaCategoria.length > 0) {
        grupos.push({ nombre: categoria.nombre, productos: deLaCategoria });
      }
    });

    var sinCategoria = productos.filter(function (p) {
      return !p.categoria_id;
    });
    if (sinCategoria.length > 0) {
      grupos.push({ nombre: "Otros", productos: sinCategoria });
    }

    return grupos;
  }

  function crearElementoProducto(producto) {
    var fila = document.createElement("div");
    fila.className = "producto" + (producto.agotado ? " agotado" : "");

    var info = document.createElement("div");
    info.className = "info-producto";

    var nombre = document.createElement("p");
    nombre.className = "nombre-producto";
    nombre.textContent = producto.nombre;
    info.appendChild(nombre);

    if (producto.descripcion) {
      var descripcion = document.createElement("p");
      descripcion.className = "descripcion-producto";
      descripcion.textContent = producto.descripcion;
      info.appendChild(descripcion);
    }

    var precio = document.createElement("p");
    precio.className = "precio-producto";
    precio.textContent = formatearPrecio(producto.precio);
    info.appendChild(precio);

    fila.appendChild(info);

    if (producto.agotado) {
      var etiqueta = document.createElement("span");
      etiqueta.className = "etiqueta-agotado";
      etiqueta.textContent = "Agotado";
      fila.appendChild(etiqueta);
    } else {
      var boton = document.createElement("button");
      boton.type = "button";
      boton.className = "boton-agregar";
      boton.setAttribute("aria-label", "Agregar " + producto.nombre);
      boton.textContent = "+";
      boton.addEventListener("click", function () {
        agregarAlCarrito(producto.id);
      });
      fila.appendChild(boton);
    }

    return fila;
  }

  function renderMenu(categorias, productos) {
    menu.innerHTML = "";
    productosPorId = {};
    productos.forEach(function (p) {
      productosPorId[p.id] = p;
    });

    if (productos.length === 0) {
      var vacio = document.createElement("p");
      vacio.className = "menu-vacio";
      vacio.textContent = "Todavía no hay productos disponibles.";
      menu.appendChild(vacio);
      return;
    }

    var grupos = agruparProductosPorCategoria(categorias, productos);
    grupos.forEach(function (grupo) {
      var seccion = document.createElement("div");
      seccion.className = "categoria";

      var titulo = document.createElement("h2");
      titulo.className = "titulo-categoria";
      titulo.textContent = grupo.nombre;
      seccion.appendChild(titulo);

      grupo.productos.forEach(function (producto) {
        seccion.appendChild(crearElementoProducto(producto));
      });

      menu.appendChild(seccion);
    });
  }

  // ---- Carrito ----

  function calcularTotales() {
    var cantidad = 0;
    var total = 0;
    Object.keys(carrito).forEach(function (id) {
      var producto = productosPorId[id];
      if (!producto) return;
      cantidad += carrito[id];
      total += carrito[id] * Number(producto.precio);
    });
    return { cantidad: cantidad, total: total };
  }

  function actualizarBarraCarrito() {
    var totales = calcularTotales();

    if (totales.cantidad === 0) {
      barraCarrito.classList.remove("visible");
      cerrarPanelCarrito();
      return;
    }

    barraCarrito.classList.add("visible");
    cantidadCarrito.textContent = totales.cantidad + (totales.cantidad === 1 ? " artículo" : " artículos");
    totalCarrito.textContent = formatearPrecio(totales.total);
    totalPie.textContent = formatearPrecio(totales.total);
  }

  function agregarAlCarrito(productoId) {
    var producto = productosPorId[productoId];
    if (!producto || producto.agotado) return;
    carrito[productoId] = (carrito[productoId] || 0) + 1;
    actualizarBarraCarrito();
  }

  function cambiarCantidad(productoId, delta) {
    var nueva = (carrito[productoId] || 0) + delta;
    if (nueva <= 0) {
      delete carrito[productoId];
    } else {
      carrito[productoId] = nueva;
    }
    actualizarBarraCarrito();
    renderCarrito();
  }

  function quitarDelCarrito(productoId) {
    delete carrito[productoId];
    actualizarBarraCarrito();
    renderCarrito();
  }

  function crearFilaCarrito(productoId, cantidad) {
    var producto = productosPorId[productoId];
    if (!producto) return null;

    var fila = document.createElement("div");
    fila.className = "fila-carrito";

    var info = document.createElement("div");
    info.className = "info-fila-carrito";

    var nombre = document.createElement("p");
    nombre.className = "nombre-fila-carrito";
    nombre.textContent = producto.nombre;
    info.appendChild(nombre);

    var subtotal = document.createElement("p");
    subtotal.className = "subtotal-fila-carrito";
    subtotal.textContent = formatearPrecio(Number(producto.precio) * cantidad);
    info.appendChild(subtotal);

    var quitar = document.createElement("button");
    quitar.type = "button";
    quitar.className = "quitar-fila-carrito";
    quitar.textContent = "Quitar";
    quitar.addEventListener("click", function () {
      quitarDelCarrito(productoId);
    });
    info.appendChild(quitar);

    var contador = document.createElement("div");
    contador.className = "contador";

    var menos = document.createElement("button");
    menos.type = "button";
    menos.textContent = "−";
    menos.setAttribute("aria-label", "Quitar uno");
    menos.addEventListener("click", function () {
      cambiarCantidad(productoId, -1);
    });

    var numero = document.createElement("span");
    numero.textContent = cantidad;

    var mas = document.createElement("button");
    mas.type = "button";
    mas.textContent = "+";
    mas.setAttribute("aria-label", "Agregar uno");
    mas.addEventListener("click", function () {
      cambiarCantidad(productoId, 1);
    });

    contador.appendChild(menos);
    contador.appendChild(numero);
    contador.appendChild(mas);

    fila.appendChild(info);
    fila.appendChild(contador);
    return fila;
  }

  function renderCarrito() {
    carritoLista.innerHTML = "";
    var ids = Object.keys(carrito);

    if (ids.length === 0) {
      var vacio = document.createElement("p");
      vacio.className = "carrito-vacio";
      vacio.textContent = "Tu carrito está vacío.";
      carritoLista.appendChild(vacio);
      return;
    }

    ids.forEach(function (id) {
      var fila = crearFilaCarrito(id, carrito[id]);
      if (fila) carritoLista.appendChild(fila);
    });
  }

  function mostrarVistaPanel(vista) {
    vistaCarrito.hidden = vista !== vistaCarrito;
    vistaCheckout.hidden = vista !== vistaCheckout;
    vistaConfirmacion.hidden = vista !== vistaConfirmacion;
  }

  function abrirPanelCarrito() {
    renderCarrito();
    mostrarVistaPanel(vistaCarrito);
    carritoOverlay.classList.add("visible");
    carritoPanel.classList.add("visible");
  }

  function cerrarPanelCarrito() {
    if (enviandoPedido) return;
    carritoOverlay.classList.remove("visible");
    carritoPanel.classList.remove("visible");
  }

  barraCarrito.addEventListener("click", abrirPanelCarrito);
  cerrarCarrito.addEventListener("click", cerrarPanelCarrito);
  carritoOverlay.addEventListener("click", cerrarPanelCarrito);

  // ---- Checkout ----

  function mostrarMensajeCheckout(texto, tipo) {
    mensajeCheckout.textContent = texto;
    mensajeCheckout.className = "mensaje-checkout " + tipo;
    mensajeCheckout.hidden = false;
  }

  function seleccionarModalidad(valor) {
    modalidadSeleccionada = valor;
    modalidadRecoger.classList.toggle("activo", valor === "recoger");
    modalidadEntrega.classList.toggle("activo", valor === "entrega");
    grupoDireccion.hidden = valor !== "entrega";
  }

  modalidadRecoger.addEventListener("click", function () {
    seleccionarModalidad("recoger");
  });

  modalidadEntrega.addEventListener("click", function () {
    seleccionarModalidad("entrega");
  });

  btnHacerPedido.addEventListener("click", function () {
    mensajeCheckout.hidden = true;

    if (kioscoActual && kioscoActual.pide_direccion) {
      grupoModalidad.hidden = false;
      seleccionarModalidad(modalidadSeleccionada);
    } else {
      grupoModalidad.hidden = true;
      grupoDireccion.hidden = true;
      modalidadSeleccionada = "recoger";
    }

    mostrarVistaPanel(vistaCheckout);
  });

  volverCarrito.addEventListener("click", function () {
    if (enviandoPedido) return;
    mostrarVistaPanel(vistaCarrito);
  });

  cerrarCheckout.addEventListener("click", cerrarPanelCarrito);

  function mostrarConfirmacion(datos) {
    carrito = {};
    barraCarrito.classList.remove("visible");
    tituloConfirmacion.textContent = datos.mensaje || "Pedido enviado";
    numeroConfirmacion.textContent = "Pedido #" + datos.numero;
    totalConfirmacion.textContent = formatearPrecio(datos.total);
    mostrarVistaPanel(vistaConfirmacion);
  }

  btnCerrarConfirmacion.addEventListener("click", function () {
    formCheckout.reset();
    seleccionarModalidad("recoger");
    mostrarVistaPanel(vistaCarrito);
    cerrarPanelCarrito();
  });

  formCheckout.addEventListener("submit", function (evento) {
    evento.preventDefault();
    if (enviandoPedido) return;

    var nombre = checkoutNombre.value.trim();
    var telefono = checkoutTelefono.value.trim();
    var nota = checkoutNota.value.trim();
    var direccion = checkoutDireccion.value.trim();
    var modalidad = (kioscoActual && kioscoActual.pide_direccion) ? modalidadSeleccionada : "recoger";

    if (!nombre) {
      mostrarMensajeCheckout("Escribe tu nombre.", "error");
      return;
    }
    if (!telefono) {
      mostrarMensajeCheckout("Escribe tu teléfono.", "error");
      return;
    }
    if (modalidad === "entrega" && !direccion) {
      mostrarMensajeCheckout("Escribe la dirección de entrega.", "error");
      return;
    }

    var items = Object.keys(carrito).map(function (id) {
      return { producto_id: id, cantidad: carrito[id], opciones: [] };
    });

    if (items.length === 0) {
      mostrarMensajeCheckout("Tu carrito está vacío.", "error");
      return;
    }

    enviandoPedido = true;
    mensajeCheckout.hidden = true;
    btnEnviarPedido.disabled = true;
    btnEnviarPedido.textContent = "Enviando...";

    fetch(URL_CREAR_PEDIDO, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON,
        "Authorization": "Bearer " + SUPABASE_ANON
      },
      body: JSON.stringify({
        slug: kioscoActual.slug,
        cliente_nombre: nombre,
        cliente_telefono: telefono,
        direccion: modalidad === "entrega" ? direccion : "",
        modalidad: modalidad,
        nota: nota,
        items: items
      })
    }).then(function (respuesta) {
      return respuesta.json();
    }).then(function (datos) {
      enviandoPedido = false;
      btnEnviarPedido.disabled = false;
      btnEnviarPedido.textContent = "Enviar pedido";

      if (!datos || !datos.ok) {
        mostrarMensajeCheckout((datos && datos.mensaje) || "Algo salió mal. Intenta de nuevo en un momento.", "error");
        return;
      }

      mostrarConfirmacion(datos);
    }).catch(function () {
      enviandoPedido = false;
      btnEnviarPedido.disabled = false;
      btnEnviarPedido.textContent = "Enviar pedido";
      mostrarMensajeCheckout("No se pudo conectar. Revisa tu internet e intenta de nuevo.", "error");
    });
  });

  // ---- Carga de datos ----

  function cargarKiosco(slug) {
    sb.from("kioscos")
      .select(COLUMNAS_KIOSCO)
      .eq("slug", slug)
      .eq("publicado", true)
      .maybeSingle()
      .then(function (resultado) {
        if (resultado.error || !resultado.data) {
          mostrarSolo(estadoNoDisponible);
          return;
        }

        kioscoActual = resultado.data;
        document.title = kioscoActual.nombre;
        document.body.setAttribute("data-tema", kioscoActual.tema === "moderno" ? "moderno" : "claro");
        document.body.setAttribute("data-color", kioscoActual.color_acento || "grafito");

        nombreNegocio.textContent = kioscoActual.nombre;
        if (kioscoActual.descripcion) {
          descripcionNegocio.textContent = kioscoActual.descripcion;
          descripcionNegocio.hidden = false;
        }

        if (kioscoActual.portada_url) {
          imgPortadaNegocio.src = kioscoActual.portada_url;
          imgPortadaNegocio.alt = "Portada de " + kioscoActual.nombre;
          portadaNegocio.hidden = false;
        }

        if (kioscoActual.logo_url) {
          imgLogoNegocio.src = kioscoActual.logo_url;
          imgLogoNegocio.alt = "Logo de " + kioscoActual.nombre;
          logoNegocio.hidden = false;
        }

        cargarMenu(kioscoActual.id);
      })
      .catch(function () {
        mostrarSolo(estadoNoDisponible);
      });
  }

  function cargarMenu(kioscoId) {
    Promise.all([
      sb.from("kiosco_categorias").select("id,nombre,orden").eq("kiosco_id", kioscoId).eq("activa", true).order("orden", { ascending: true }),
      sb.from("kiosco_productos").select("id,categoria_id,nombre,descripcion,precio,activo,agotado,orden").eq("kiosco_id", kioscoId).eq("activo", true).order("orden", { ascending: true })
    ]).then(function (resultados) {
      var resCategorias = resultados[0];
      var resProductos = resultados[1];

      if (resCategorias.error || resProductos.error) {
        mostrarSolo(estadoNoDisponible);
        return;
      }

      renderMenu(resCategorias.data || [], resProductos.data || []);
      mostrarSolo(contenido);
    }).catch(function () {
      mostrarSolo(estadoNoDisponible);
    });
  }

  var slug = obtenerSlug();
  if (!slug) {
    mostrarSolo(estadoNoDisponible);
  } else {
    cargarKiosco(slug);
  }
})();
</script>

</body>
</html>
