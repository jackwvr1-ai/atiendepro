<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicia sesión — Kiosco</title>
<link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<div class="tarjeta">
  <p class="logo">Kiosco</p>
  <p class="subtitulo">Entra para administrar tu kiosco.</p>

  <form id="formLogin" novalidate>
    <div class="campo">
      <label for="correo">Correo</label>
      <input type="email" id="correo" name="correo" placeholder="tu@correo.com" autocomplete="email" required>
    </div>

    <div class="campo">
      <label for="clave">Contraseña</label>
      <input type="password" id="clave" name="clave" placeholder="Tu contraseña" autocomplete="current-password" required>
    </div>

    <div id="mensaje" class="mensaje" hidden></div>

    <button type="submit" id="btnLogin">Iniciar sesión</button>
  </form>

  <p class="pie"><a href="/recuperar">¿Olvidaste tu contraseña?</a></p>
  <p class="pie">¿No tienes cuenta? <a href="/crear-cuenta">Regístrate</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://wetpjfpefypgzmcfoxui.supabase.co";
  var SUPABASE_ANON = "sb_publishable_e9LsWcWIJ3O_nmt2oGAJ5Q_JntD51xn";

  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
    auth: { storageKey: "kiosco-auth" }
  });

  var form = document.getElementById("formLogin");
  var mensaje = document.getElementById("mensaje");
  var boton = document.getElementById("btnLogin");

  function mostrarMensaje(texto, tipo) {
    mensaje.textContent = texto;
    mensaje.className = "mensaje " + tipo;
    mensaje.hidden = false;
  }

  function traducirError(error) {
    var msg = (error && error.message) || "";

    if (msg.indexOf("Invalid login credentials") !== -1) {
      return "Correo o contraseña incorrectos.";
    }
    if (msg.indexOf("Email not confirmed") !== -1) {
      return "Debes confirmar tu correo antes de entrar. Revisa tu bandeja de entrada.";
    }
    if (msg.indexOf("Failed to fetch") !== -1 || msg.indexOf("NetworkError") !== -1) {
      return "No se pudo conectar. Revisa tu internet e intenta de nuevo.";
    }
    return "Algo salió mal. Intenta de nuevo en un momento.";
  }

  form.addEventListener("submit", function (evento) {
    evento.preventDefault();
    mensaje.hidden = true;

    var correo = document.getElementById("correo").value.trim();
    var clave = document.getElementById("clave").value;

    boton.disabled = true;
    boton.textContent = "Entrando...";

    sb.auth.signInWithPassword({
      email: correo,
      password: clave
    }).then(function (resultado) {
      if (resultado.error) {
        boton.disabled = false;
        boton.textContent = "Iniciar sesión";
        mostrarMensaje(traducirError(resultado.error), "error");
        return;
      }

      window.location.href = "/app";
    }).catch(function () {
      boton.disabled = false;
      boton.textContent = "Iniciar sesión";
      mostrarMensaje("No se pudo conectar. Revisa tu internet e intenta de nuevo.", "error");
    });
  });
})();
</script>

</body>
</html>
